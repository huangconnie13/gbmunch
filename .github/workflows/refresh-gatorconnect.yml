name: Refresh GatorConnect snapshot

# Free on public repos. Keeps public/data/gatorconnect-snapshot.json fresh so the
# app still has real events if the live /api/gc proxy is ever unreachable.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot-gatorconnect.mjs
      - name: Commit if changed
        run: |
          git config user.name "gbmunch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/gatorconnect-snapshot.json
          git diff --cached --quiet || git commit -m "chore: refresh GatorConnect snapshot"
          git push
